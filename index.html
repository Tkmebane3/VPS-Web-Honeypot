<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeMaster Pro</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            width: 350px;
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,.5);
        }
        h2 {
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .warning {
            text-align: center;
            margin-top: 15px;
            color: #facc15;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>TradeMaster Pro</h2>

    <form id="loginForm">

        <input
            type="text"
            placeholder="Username"
            name="username"
            required
        >

        <input
            type="password"
            placeholder="Password"
            name="password"
            required
        >
        <button type="submit">
            Login
        </button>

    </form>

    <div class="warning">
        Secure Trading Infrastructure
    </div>

</div>

<script>
document
.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    alert(
        "Trading platform currently under maintenance."
    );
});
</script>

</body>
</html>
